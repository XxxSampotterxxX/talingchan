name: Build Windows installer
on:
  push:
    branches: [main]
    paths: ["package.json", "main.js", "game/**", "scripts/**", "RELEASE_NOTES.md", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/fetch-art.js
      - run: npx electron-builder --win --publish never
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 && gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" dist/*.exe dist/*.exe.blockmap dist/latest.yml --title "v$V" --notes-file RELEASE_NOTES.md
